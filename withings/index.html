<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Zurück zu Plainlift</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 16px; text-align: center; }
  a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 12px; background: #0a84ff; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<p>Withings ist verbunden. Zurück zu Plainlift …</p>
<a id="weiter" href="plainlift://oauth/withings">Plainlift öffnen</a>
<script>
  // Gibt nur Code und Status von Withings an die App weiter. Diese Seite
  // speichert nichts, lädt nichts nach und sendet nichts an einen Dritten.
  var ziel = "plainlift://oauth/withings" + window.location.search;
  document.getElementById("weiter").href = ziel;
  window.location.replace(ziel);
</script>
</body>
</html>
